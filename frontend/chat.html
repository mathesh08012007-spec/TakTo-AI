<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat | Takto</title>
  <meta name="description" content="Chat with Takto, your AI companion.">
  <link rel="icon" type="image/svg+xml" href="img/takto.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="chat-page">
  <a class="skip-link" href="#messages">Skip to conversation</a>
  <header class="topbar">
    <button type="button" class="icon-btn only-mobile" id="menu-btn" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="persona" href="index.html" aria-label="Takto home"><span class="persona-avatar"><img src="img/takto.svg" alt=""><span class="status-dot" id="status-dot"></span></span><span class="persona-text"><strong>Takto</strong><small id="status-text" role="status">Online</small></span></a>
    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="fun-btn">😂 Fun</button>
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch theme"></button>
      <a class="icon-btn" href="profile.html" aria-label="Profile and settings" title="Profile and settings">⚙️</a>
      <button type="button" class="btn btn-ghost" data-logout>Log out</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <button type="button" class="btn btn-primary btn-block" id="new-chat">+ New chat</button>
      <div>
        <label class="sr-only" for="search">Search conversations</label>
        <input type="search" id="search" placeholder="Search chats" autocomplete="off">
      </div>
      <nav class="conv-list" id="conv-list" aria-label="Conversation history"></nav>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="chat">
      <div class="chat-head">
        <h1 id="conv-title">New chat</h1>
        <button type="button" class="btn btn-ghost" id="rename-btn" hidden>Rename</button>
        <button type="button" class="btn btn-ghost" id="clear-btn" hidden>Clear</button>
      </div>
      <div class="modes" id="modes" role="group" aria-label="Conversation mode"></div>

      <div class="messages" id="messages" role="log" aria-label="Conversation" tabindex="0"></div>
      <div class="suggestions" id="suggestions" aria-label="Suggested follow-ups"></div>

      <form class="composer" id="composer">
        <label class="sr-only" for="input">Message</label>
        <textarea id="input" rows="1" maxlength="8000" placeholder="Type a message…" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="send" aria-label="Send message"></button>
      </form>
      <p class="hint-line">Enter to send · Shift + Enter for a new line</p>
    </main>
  </div>

  <dialog id="fun-dialog" aria-labelledby="fun-title">
    <h2 id="fun-title">Fun corner</h2>
    <p>Pick one and your companion will run it with you.</p>
    <div class="fun-grid" id="fun-grid"></div>
    <div class="actions"><button type="button" class="btn" id="fun-close">Close</button></div>
  </dialog>

  <script src="js/markdown.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
